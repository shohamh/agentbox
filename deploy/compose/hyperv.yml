# Publishes the control-plane ports the appliance needs, on loopback only. The
# appliance VM reaches them through agentbox-host over vsock (the "uplink"), so
# nothing listens on the Hyper-V virtual switch and no firewall rule is needed.
#   docker compose -p agentbox -f deploy/compose/docker-compose.yml -f deploy/compose/hyperv.yml #     --env-file deploy/compose/.secrets/compose.env up -d
services:
  front-envoy:
    ports: ["127.0.0.1:443:443"]
  permsvc:
    ports: ["127.0.0.1:8443:8443"]
  otel-gateway:
    ports: ["127.0.0.1:4318:4318"]
  console:
    ports: ["127.0.0.1:18443:8443"]
  registry:
    ports: ["127.0.0.1:5000:5000"]
