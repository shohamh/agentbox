set timeout=0
echo 'agentbox: searching for the root filesystem'
search --no-floppy --label abxroot --set=root
echo 'agentbox: loading the kernel'
linux /vmlinuz root=LABEL=abxroot rw systemd.show_status=1 console=tty0 console=ttyS0,115200 net.ifnames=0 @EXTRA@
echo 'agentbox: loading the initramfs'
initrd /initrd.img
echo 'agentbox: booting'
boot
